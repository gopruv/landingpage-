<div class="orc-badge">
  <div class="orc-badge__frame">
    <div class="orc-badge__card">

            <div class="orc-badge__head">
        <span class="orc-badge__mark">
          <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="20" fill="#eb4511"></circle>
          </svg>
          <span>Orcred</span>
        </span>
        <span class="orc-badge__pill"><i></i><span>Verified</span></span>
      </div>

            <div class="orc-badge__body">
        <svg class="orc-badge__check" viewBox="0 0 100 100" fill="none" aria-hidden="true">
          <circle cx="50" cy="50" r="50" fill="#eb4511"></circle>
          <path d="M 29 51 l 14.5 14.5 L 71 34.5" stroke="#fff" stroke-width="8"
                stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
        </svg>
        <span class="orc-badge__label">Project</span>
        <div class="orc-badge__project">{{PROJECT_TITLE}}</div>
        <div class="orc-badge__stack">{{TECH_STACK}}</div>
      </div>

            <div class="orc-badge__foot"><span>{{CREDENTIAL_ID}}</span></div>

    </div>
  </div>
</div>
